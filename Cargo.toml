[package]
name = "hyprbinds"
version = "0.1.0"
edition = "2024"
description = "GTK4 Hyprland configuration studio — binds, rules, and settings with safe backups"
license = "MIT"
readme = "README.md"
keywords = ["hyprland", "wayland", "gtk", "keybinds", "config"]
categories = ["gui", "config"]

[dependencies]
cxx = "1"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["full"] }
dirs = "6.0.0"
gtk4 = { version = "0.11.4", features = ["v4_12"] }
hidapi = "2.6.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml_edit = "0.22"
via-protocol = "0.1.0"

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
