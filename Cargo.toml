[package]
name = "hyprbinds"
version = "0.1.0"
edition = "2024"
description = "GTK4 Hyprland configuration studio — binds, rules, and settings with safe backups"
license = "GPL-2.0-only"
readme = "README.md"
keywords = ["hyprland", "wayland", "gtk", "keybinds", "config"]
categories = ["gui", "config"]

[dependencies]
dirs = "6.0.0"
gtk4 = { version = "0.11.4", features = ["v4_12"] }
hidapi = "2.6.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml_edit = "0.22"
via-protocol = { git = "https://github.com/mikkurogue/viar", rev = "f7d90d9ddfba108e77577ac228f62f8c1118995e" }
